name: leetcode-monorepo

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22-alpine
        PNPM_VERSION: 11.24.0
    image: leetcode-monorepo:dev
    container_name: leetcode-app
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"

    ports:
      - "${PORT:-3000}:3000"

    volumes:
      # Bind mount trực tiếp vào repo để dùng chung DB với dev local
      - ./packages/database/data:/app/packages/database/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s