<div class="flex h-full flex-col">
  <header class="border-b border-border bg-card">
    <div class="flex items-center justify-between gap-4 px-4 py-2.5 md:px-6">
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="flex items-center gap-2.5 cursor-pointer"
          (click)="toggleSidebar()"
          title="Toggle sidebar"
        >
          <img
            src="assets/leetcodeLab.png"
            alt="LeetCode Lab"
            class="h-7 w-7 object-contain"
            width="28"
            height="28"
          />
          <span class="text-lg font-bold tracking-tight">
            LeetCode <span class="text-sm font-semibold text-blue-500">Admin</span>
          </span>
        </button>
      </div>
      <button
        type="button"
        class="btn !px-2.5 !py-2"
        (click)="toggleTheme()"
        [attr.aria-label]="theme.isDark() ? 'Chuyển sang sáng' : 'Chuyển sang tối'"
        [title]="theme.isDark() ? 'Sáng' : 'Tối'"
      >
        <i class="fa-solid fa-xl" [ngClass]="theme.isDark() ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
      </button>
    </div>
  </header>
  <div class="flex min-h-0 flex-1 flex-col md:flex-row">
    @if (sidebarOpen()) {
      <app-sidebar class="md:w-56 md:flex-none md:border-r md:border-border"></app-sidebar>
    }
    <main class="min-w-0 flex-1 overflow-auto p-4 md:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
