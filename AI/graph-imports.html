function groupOf(p) {
  if (p.startsWith("apps/web")) return "web";
  if (p.startsWith("apps/server")) return "server";
  if (p.startsWith("apps/extension")) return "extension";
  if (p.startsWith("apps/admin")) return "admin";
  if (p.startsWith("packages/")) return p.split("/")[1];
  return "docs";
}
const palette = {
  web: "#60a5fa", server: "#f87171", extension: "#34d399", admin: "#fbbf24",
  shared: "#a78bfa", database: "#f472b6", editor: "#94a3b8", layout: "#22d3ee",
  "problem-engine": "#fb923c", ai: "#e879f9", "javascript-docs": "#4ade80", docs: "#64748b"
};

const links = [];
const deg = {};
for (const line of MD.split("\n")) {
  const [s, t] = line.split("|");
  if (!s || !t) continue;
  links.push({ source: s, target: t });
  deg[s] = (deg[s] || 0) + 1;
  deg[t] = (deg[t] || 0) + 1;
}
const nodes = [...new Set(links.flatMap(l => [l.source, l.target]))].map(p => ({
  id: p, group: groupOf(p), color: palette[groupOf(p)] || "#999", val: 2 + (deg[p] || 1)
}));

const fg = ForceGraph()(document.getElementById("graph"))
  .backgroundColor("#0b1020")
  .nodeId("id").nodeLabel("id")
  .nodeColor("color").nodeVal("val")
  .linkColor(() => "rgba(148,163,184,0.25)")
  .linkDirectionalParticles(1).linkDirectionalParticleWidth(1.5)
  .linkDirectionalArrowLength(3.5).linkDirectionalArrowRelPos(1)
  .onNodeClick(n => { fg.centerAt(n.x, n.y, 800); fg.zoom(3, 800); });
fg.d3Force("charge").strength(-80);

const active = new Set(Object.keys(palette));
function apply() {
  const ns = nodes.filter(n => active.has(n.group));
  const ids = new Set(ns.map(n => n.id));
  fg.graphData({ nodes: ns, links: links.filter(l => ids.has(l.source.id ?? l.source) && ids.has(l.target.id ?? l.target)) });
  document.getElementById("info").textContent = ns.length + " files, " + fg.graphData().links.length + " import edges. Hover = path, click = zoom.";
}
const lg = document.getElementById("lgitems");
for (const [name, color] of Object.entries(palette)) {
  const span = document.createElement("span");
  span.className = "lg";
  span.innerHTML = '<span class="dot" style="background:' + color + '"></span>' + name;
  span.onclick = () => { active.has(name) ? active.delete(name) : active.add(name); span.style.opacity = active.has(name) ? 1 : 0.3; apply(); };
  lg.appendChild(span);
}
apply();
</script>
